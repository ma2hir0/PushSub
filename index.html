<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><title>KoBoTrade PushSubscriptionテスト</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:24px;background:#f5f5f7}
.card{background:#fff;border-radius:16px;padding:20px;max-width:620px;margin:auto}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px}
#sub{background:#111;color:#fff}#copy{background:#e5e5ea}
#status{margin-top:18px;padding:12px;border-radius:10px;background:#f0f0f2;white-space:pre-wrap;word-break:break-all}
</style></head><body><div class="card">
<h1>PushSubscriptionテスト</h1>
<p>iPhoneのホーム画面WebアプリでWeb Push購読情報を取得できるか確認します。</p>
<button id="sub">PushSubscriptionを取得</button>
<button id="copy">購読情報をコピー</button>
<div id="status">確認中…</div></div>
<script>
const VAPID_PUBLIC_KEY="BAwUJxIa7mJZMqu78Tfy2vqbp1tFuj4KwX3gRuF2e_5WGB0tGnvCBGtvVDEa6YdjnjAors3E1WBlcCTow6pGg";
const status=document.getElementById("status");let subscription=null;
function show(s){status.textContent=s}
function key(s){const p="=".repeat((4-s.length%4)%4);const b=(s+p).replace(/-/g,"+").replace(/_/g,"/");const r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function subscribe(){
 try{
  if(!isSecureContext)throw Error("HTTPSではありません");
  if(!("serviceWorker"in navigator))throw Error("Service Worker非対応です");
  if(!("PushManager"in window))throw Error("PushManagerが利用できません。ホーム画面Webアプリとして起動してください");
  if(!("Notification"in window))throw Error("Notification API非対応です");
  const p=await Notification.requestPermission();
  if(p!=="granted")throw Error("通知許可がgrantedではありません: "+p);
  const reg=await navigator.serviceWorker.register("./sw.js");
  await navigator.serviceWorker.ready;
  subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key(VAPID_PUBLIC_KEY)});
  const j=subscription.toJSON();
  show("取得成功！\n\nendpoint:\n"+j.endpoint+"\n\np256dh:\n"+(j.keys?.p256dh||"")+"\n\nauth:\n"+(j.keys?.auth||""));
 }catch(e){show("取得失敗:\n"+(e.stack||e))}
}
async function copySub(){
 if(!subscription){show("先にPushSubscriptionを取得してください");return}
 await navigator.clipboard.writeText(JSON.stringify(subscription.toJSON()));
 show(status.textContent+"\n\n購読情報をコピーしました。");
}
document.getElementById("sub").onclick=subscribe;
document.getElementById("copy").onclick=copySub;
show("HTTPS: "+(isSecureContext?"OK":"NG")+"\nPushManager: "+("PushManager"in window?"利用可能":"利用不可")+"\n表示モード: "+(matchMedia("(display-mode: standalone)").matches?"ホーム画面Webアプリ":"ブラウザ"));
</script></body></html>
