<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>KoBoTrade PushSubscriptionテスト4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;background:#f5f5f7;color:#111}
.card{background:#fff;padding:20px;border-radius:16px;max-width:620px;margin:auto}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px}
#go{background:#111;color:#fff}
#status{margin-top:18px;padding:12px;background:#f0f0f2;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h1>PushSubscriptionテスト4</h1>
<p>ブラウザで生成したP-256鍵を使ってPushSubscriptionを取得します。</p>
<button id="go">PushSubscriptionを取得</button>
<div id="status">確認中…</div>
</div>
<script>
const status=document.getElementById("status");
function show(x){status.textContent=x}

async function go(){
  try{
    if(!isSecureContext) throw Error("HTTPSではありません");
    if(!("serviceWorker" in navigator)) throw Error("Service Worker非対応です");
    if(!("PushManager" in window)) throw Error("PushManagerが利用できません");
    if(!("Notification" in window)) throw Error("Notification API非対応です");
    if(!crypto?.subtle) throw Error("Web Crypto APIが利用できません");

    const permission=await Notification.requestPermission();
    if(permission!=="granted") throw Error("通知許可: "+permission);

    // Generate a fresh P-256 VAPID key pair in the browser.
    const kp=await crypto.subtle.generateKey(
      {name:"ECDSA",namedCurve:"P-256"},
      true,
      ["sign","verify"]
    );

    // Export the public key in uncompressed EC point format (65 bytes).
    const jwk=await crypto.subtle.exportKey("jwk",kp.publicKey);
    if(jwk.crv!=="P-256") throw Error("生成鍵がP-256ではありません");
    if(!jwk.x || !jwk.y) throw Error("公開鍵の座標を取得できません");

    function b64u(s){
      const pad="=".repeat((4-s.length%4)%4);
      const raw=atob((s+pad).replace(/-/g,"+").replace(/_/g,"/"));
      return Uint8Array.from(raw,c=>c.charCodeAt(0));
    }

    const x=b64u(jwk.x), y=b64u(jwk.y);
    const publicKey=new Uint8Array(65);
    publicKey[0]=4;
    publicKey.set(x,1);
    publicKey.set(y,33);

    if(publicKey.length!==65) throw Error("公開鍵長が不正です");

    const reg=await navigator.serviceWorker.register("./sw.js");
    await navigator.serviceWorker.ready;

    const sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:publicKey
    });

    const j=sub.toJSON();
    show(
      "取得成功！\n\n"+
      "endpoint:\n"+j.endpoint+
      "\n\np256dh:\n"+(j.keys?.p256dh||"")+
      "\n\nauth:\n"+(j.keys?.auth||"")
    );
  }catch(e){
    show("取得失敗:\n"+(e.stack||e));
  }
}

document.getElementById("go").onclick=go;
show(
 "HTTPS: "+(isSecureContext?"OK":"NG")+
 "\nPushManager: "+("PushManager" in window?"利用可能":"利用不可")+
 "\nService Worker: "+("serviceWorker" in navigator?"利用可能":"利用不可")+
 "\nWeb Crypto: "+(crypto?.subtle?"利用可能":"利用不可")+
 "\n表示モード: "+(matchMedia("(display-mode: standalone)").matches?"ホーム画面Webアプリ":"ブラウザ")
);
</script>
</body>
</html>
