<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>KoBoTrade PushSubscriptionテスト3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;background:#f5f5f7;color:#111}
.card{background:#fff;padding:20px;border-radius:16px;max-width:620px;margin:auto}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px}
#go{background:#111;color:#fff}
#status{margin-top:18px;padding:12px;background:#f0f0f2;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h1>PushSubscriptionテスト3</h1>
<p>公開鍵をJavaScriptのバイト配列として直接指定し、Base64変換を使わずにテストします。</p>
<button id="go">PushSubscriptionを取得</button>
<div id="status">確認中…</div>
</div>

<script>
const VAPID_PUBLIC_KEY = new Uint8Array([4, 107, 23, 209, 242, 225, 44, 66, 71, 248, 188, 230, 229, 58, 68, 15, 39, 112, 55, 216, 18, 222, 179, 58, 15, 74, 19, 148, 93, 137, 140, 41, 100, 79, 227, 66, 226, 254, 26, 127, 155, 142, 231, 235, 74, 124, 15, 158, 22, 43, 206, 51, 87, 107, 49, 94, 206, 203, 182, 64, 104, 55, 191, 81, 245]);
const status = document.getElementById("status");

function show(text) {
  status.textContent = text;
}

async function go() {
  try {
    if (!window.isSecureContext)
      throw new Error("HTTPSではありません");

    if (!("serviceWorker" in navigator))
      throw new Error("Service Worker非対応です");

    if (!("PushManager" in window))
      throw new Error("PushManagerが利用できません");

    if (!("Notification" in window))
      throw new Error("Notification API非対応です");

    if (VAPID_PUBLIC_KEY.length !== 65)
      throw new Error("公開鍵の長さが不正: " + VAPID_PUBLIC_KEY.length + " bytes");

    const permission = await Notification.requestPermission();

    if (permission !== "granted")
      throw new Error("通知許可: " + permission);

    const registration =
      await navigator.serviceWorker.register("./sw.js");

    await navigator.serviceWorker.ready;

    const subscription =
      await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: VAPID_PUBLIC_KEY
      });

    const json = subscription.toJSON();

    show(
      "取得成功！\n\n" +
      "endpoint:\n" + json.endpoint +
      "\n\np256dh:\n" + (json.keys?.p256dh || "") +
      "\n\nauth:\n" + (json.keys?.auth || "")
    );

  } catch (error) {
    show("取得失敗:\n" + (error.stack || error));
  }
}

document.getElementById("go").onclick = go;

show(
  "HTTPS: " + (window.isSecureContext ? "OK" : "NG") +
  "\nPushManager: " + ("PushManager" in window ? "利用可能" : "利用不可") +
  "\nService Worker: " + ("serviceWorker" in navigator ? "利用可能" : "利用不可") +
  "\n表示モード: " +
  (matchMedia("(display-mode: standalone)").matches
    ? "ホーム画面Webアプリ"
    : "ブラウザ")
);
</script>
</body>
</html>
