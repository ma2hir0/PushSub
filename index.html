<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>PushSubscriptionテスト2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;background:#f5f5f7}.card{background:#fff;padding:20px;border-radius:16px;max-width:620px;margin:auto}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px}#go{background:#111;color:#fff}#status{margin-top:18px;padding:12px;background:#f0f0f2;white-space:pre-wrap;word-break:break-all}</style></head><body><div class="card"><h1>PushSubscriptionテスト2</h1><p>PushSubscriptionを取得できるか確認します。</p><button id="go">PushSubscriptionを取得</button><div id="status">確認中…</div></div><script>
const VAPID='BAwUJxIa7mJZMqu78Tfy2vqbp1tFuj4KwX3gRuF2e_5WGB0tGnvCBGtvVDEa6YdjnjAors3E1WBlcCTow6pGg';const out=document.getElementById('status');function show(x){out.textContent=x}function decode(s){const pad='='.repeat((4-s.length%4)%4);const b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}async function go(){try{if(!isSecureContext)throw Error('HTTPSではありません');if(!('serviceWorker'in navigator))throw Error('Service Worker非対応');if(!('PushManager'in window))throw Error('PushManagerが利用できません。ホーム画面Webアプリで起動してください');if(!('Notification'in window))throw Error('Notification API非対応');const p=await Notification.requestPermission();if(p!=='granted')throw Error('通知許可: '+p);const r=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const key=decode(VAPID);if(key.byteLength!==65)throw Error('VAPID公開鍵の長さが不正: '+key.byteLength+' bytes');const sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});const j=sub.toJSON();show('取得成功！\n\nendpoint:\n'+j.endpoint+'\n\np256dh:\n'+(j.keys?.p256dh||'')+'\n\nauth:\n'+(j.keys?.auth||''))}catch(e){show('取得失敗:\n'+(e.stack||e))}}document.getElementById('go').onclick=go;show('HTTPS: '+(isSecureContext?'OK':'NG')+'\nPushManager: '+('PushManager'in window?'利用可能':'利用不可')+'\n表示モード: '+(matchMedia('(display-mode: standalone)').matches?'ホーム画面Webアプリ':'ブラウザ'));</script></body></html>
